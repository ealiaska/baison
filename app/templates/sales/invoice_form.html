{% extends "base.html" %}
{% block title %}Новый счёт — baisón{% endblock %}
{% block content %}
<h1>Новый счёт</h1>
<form method="post" action="{{ url_for('sales.invoice_add') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card">
    <div class="form-grid">
      <div><label>Клиент</label>
        <select name="client_id">
          <option value="">—</option>
          {% for c in clients %}<option value="{{ c.id }}">{{ c.name }} {{ c.phone }}</option>{% endfor %}
        </select>
      </div>
      <div><label>Заявка</label>
        <select name="lead_id">
          <option value="">—</option>
          {% for l in leads %}
          <option value="{{ l.id }}">#{{ l.id }} — {{ l.client.name if l.client else 'без клиента' }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="span-2"><label>Комментарий</label><input name="comment"></div>
    </div>
  </div>
  <div class="card">
    <table class="items-table">
      <tr><th style="width:34%">Товар</th><th>Название (ручное)</th><th style="width:12%">Кол-во</th><th style="width:16%">Цена, ₽</th><th></th></tr>
      {% for i in range(5) %}
      <tr>
        <td>
          <select name="product_id" class="item-product">
            <option value="">— выбрать —</option>
            {% for p in products %}
            <option value="{{ p.id }}" data-name="{{ p.name }}" data-price="{{ p.price }}">{{ p.sku }} — {{ p.name }}</option>
            {% endfor %}
          </select>
        </td>
        <td><input name="product_name"></td>
        <td><input name="qty" type="number" step="0.01" value="1"></td>
        <td><input name="price" type="number" step="0.01" value="0"></td>
        <td><span class="item-total muted">0 ₽</span></td>
      </tr>
      {% endfor %}
    </table>
  </div>
  <div class="row" style="justify-content: flex-end">
    <a class="btn secondary" href="{{ url_for('sales.invoices') }}">Отмена</a>
    <button>Создать счёт</button>
  </div>
</form>
{% endblock %}
{% block scripts %}{% include "_items_js.html" %}{% endblock %}
