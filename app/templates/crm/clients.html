{% extends "base.html" %}
{% block title %}Клиенты — baisón{% endblock %}
{% block content %}
<h1>Клиенты</h1>
<div class="grid" style="grid-template-columns: 1fr 320px; align-items: start;">
  <div>
    <div class="toolbar">
      <form method="get" class="row">
        <input name="q" value="{{ q }}" placeholder="Поиск: имя, телефон, компания">
        <button class="secondary">Найти</button>
      </form>
    </div>
    <table>
      <tr><th>Имя</th><th>Телефон</th><th>Компания</th><th>Адрес</th></tr>
      {% for c in clients %}
      <tr>
        <td><b><a href="{{ url_for('crm.client_detail', client_id=c.id) }}">{{ c.name }}</a></b></td>
        <td>{{ c.phone }}</td>
        <td>{{ c.company }}</td>
        <td class="muted">{{ c.address }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="muted">Клиентов нет</td></tr>
      {% endfor %}
    </table>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Новый клиент</h2>
    <form method="post" action="{{ url_for('crm.client_add') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Имя *</label><input name="name" required>
      <label>Телефон</label><input name="phone">
      <label>Email</label><input name="email">
      <label>Компания</label><input name="company">
      <label>Адрес доставки/монтажа</label><input name="address">
      <label>Заметки</label><textarea name="notes" rows="2"></textarea>
      <br><br>
      <button>Добавить</button>
    </form>
  </div>
</div>
{% endblock %}
